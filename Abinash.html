<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Special Question ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#FFEAF4,#FFF7E8,#EAFBF7);
}

.card{
    width:90%;
    max-width:650px;
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(15px);
    border-radius:30px;
    padding:45px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.15);
    z-index:2;
}

h1{
    color:#d86c91;
    margin-bottom:15px;
    font-size:2.2rem;
}

h2{
    color:#555;
    line-height:1.6;
    font-weight:400;
    margin-bottom:40px;
}

button{
    border:none;
    padding:15px 40px;
    font-size:20px;
    border-radius:40px;
    cursor:pointer;
    transition:.3s;
}

#yesBtn{
    background:#b8ead7;
    margin-right:20px;
}

#yesBtn:hover{
    transform:scale(1.08);
}

#noBtn{
    background:#ffd6e8;
}

.flower{
    position:absolute;
    animation:fall linear infinite;
    opacity:.85;
}

@keyframes fall{

from{
transform:translateY(-100vh) rotate(0deg);
}

to{
transform:translateY(110vh) rotate(360deg);
}

}

#popup{

display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
justify-content:center;
align-items:center;
z-index:99;

}

.popupCard{

background:white;
padding:45px;
border-radius:25px;
text-align:center;
animation:pop .4s;

}

.popupCard h1{

font-size:3rem;
color:#d86c91;

}

.popupCard p{

margin-top:15px;
font-size:22px;
color:#666;

}

@keyframes pop{

from{
transform:scale(.5);
opacity:0;
}

to{
transform:scale(1);
opacity:1;
}

}

</style>

</head>

<body>

<div class="card">

<h1>🌸 Hiya Bor Saikia 🌸</h1>

<h2 id="question">
Would you like to go on a movie date with me and watch
<b>Spider-Man: Brand New Day</b>? 🕷️❤️🍿
</h2>

<button id="yesBtn">Yes ❤️</button>
<button id="noBtn">No</button>

</div>

<div id="popup">

<div class="popupCard">

<h1>🎉 It's a Date! 🎉</h1>

<p>
Spider-Man: Brand New Day 🍿🕷️<br><br>
Can't wait to watch it together! ❤️🌸
</p>

</div>

</div>

<script>

const yesBtn=document.getElementById("yesBtn");
const noBtn=document.getElementById("noBtn");
const popup=document.getElementById("popup");
const question=document.getElementById("question");

const messages=[

"Are you suuure? 🥺",
"Maybe think one more time? 🌸",
"What if there's popcorn? 🍿",
"Spider-Man deserves a chance! 🕷️",
"Come on... just imagine the snacks! 🍫",
"I promise I'll behave. 😇",
"One tiny little yes? 🥹",
"You clicked No by accident... right? 😅",
"Let's pretend that click never happened. 🤭",
"I'll ask one more time. 💕",
"The Yes button misses you. ❤️",
"Still thinking? 🌷",
"What if I buy the popcorn? 🍿",
"And your favorite drink too? 🥤",
"I'll let you pick the seats! 🎟️",
"It'll be fun, I promise. 😊",
"I'm rooting for Team Yes! 🎉",
"You'd make my day. 💖",
"Maybe... just maybe? 🌸",
"I've got a really good feeling about this. ❤️",
"One last chance? 🥹",
"The movie won't be the same without you. 🕷️",
"Pretty please? 🌹",
"I'm still hoping... ❤️",
"Maybe the next click is Yes? ✨",
"Still no? I'll keep believing. 🌼",
"I think we'd have an amazing time together. 💕",
"You're awesome either way. 🌷",
"Just one little click... ❤️"

];

let i=0;

noBtn.addEventListener("click",()=>{

question.innerHTML=messages[i%messages.length];

const maxX=window.innerWidth-150;
const maxY=window.innerHeight-80;

noBtn.style.position="fixed";
noBtn.style.left=Math.random()*maxX+"px";
noBtn.style.top=Math.random()*maxY+"px";

yesBtn.style.transform=`scale(${1+Math.min(i*0.08,1.5)})`;

if(i>10)
yesBtn.innerHTML="Yes 💖";

if(i>20)
yesBtn.innerHTML="Definitely Yes ❤️";

i++;

});

yesBtn.addEventListener("click",()=>{

popup.style.display="flex";

});

const flowers=["🌸","🌷","🌺","🌼","💮","🌹"];

for(let i=0;i<35;i++){

let f=document.createElement("div");

f.className="flower";

f.innerHTML=flowers[Math.floor(Math.random()*flowers.length)];

f.style.left=Math.random()*100+"vw";

f.style.fontSize=(18+Math.random()*28)+"px";

f.style.animationDuration=(5+Math.random()*8)+"s";

f.style.animationDelay=Math.random()*5+"s";

document.body.appendChild(f);

}

</script>

</body>
</html>
